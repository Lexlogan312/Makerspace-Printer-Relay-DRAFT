# Copy to relay.toml and fill in. relay.toml is gitignored.
# Printers aren't listed here. They're managed in Supabase (the admin dashboard).

[supabase]
# Project Settings > Data API > Project URL
url = ""
# Project Settings > API Keys > Secret keys (sb_secret_...). Never the publishable key,
# and never put this key in the frontend. SUPABASE_URL / SUPABASE_KEY env vars override these.
key = ""

[relay]
# Only accept printer announcements from this network. On the Pi, use the hotspot's
# network so printers elsewhere on campus are ignored. Leave empty on a Mac for testing.
printer_network = ""          # Pi: "10.42.0.0/24"

push_interval_s = 2              # main loop: push changes this often
status_heartbeat_s = 60          # refresh unchanged printers this often, all in one request (minimum 30)
printer_sync_interval_s = 30     # pick up admin changes to printers this often
request_full_status = true       # ask printers for a full report ("pushall") on connect
full_status_interval_s = 300     # ...and this often

[camera]
# Still photos for the dashboard, so students can check their print and whether a plate is clear.
# On unless set to false. Needs sql/07 (and sql/08 for the fast refresh).
# Each setting has a minimum (shown below); a smaller number in this file is raised to it.
enabled = true
interval_s = 60            # printing printers, while someone has the board's Photos switch on (minimum 15)
idle_interval_s = 600      # open printers, printing ones while nobody has Photos on, and one right after each print ends (minimum 60)
watch_interval_s = 4       # while someone has a printer's details open (minimum 3)
watch_max = 6              # how many printers can be on that fast refresh at once (1 to 20)
# Printer lights, for clearer photos. "auto": on while a printer prints (and 30 s after, for the
# photo of the result) or while someone has it open on the dashboard; off otherwise. Lights someone
# switches themselves are left alone. "never": the relay doesn't touch them (it only switches off
# any it had turned on, so changing to "never" and restarting turns them off). This is the only thing
# the relay ever changes on a printer. Test first: uv run python -m relay.light --all
light = "never"
# Test one printer: uv run python -m relay.camera --printer "Fred Printstone"
